{% extends "base.html" %}
{% block content %}
<div class="seed-tool-container">
    <div class="seed-tool-header">
        <h2>🧪 测试数据工具</h2>
        <p class="seed-tool-desc">为 <strong>demo</strong> 用户生成不同等级的测试数据，刷新页面后即可在洞察/日记/月度看到变化。</p>
    </div>

    <div class="seed-levels">
        <div class="seed-card" data-level="new">
            <div class="seed-card-icon">🌱</div>
            <div class="seed-card-title">新用户</div>
            <div class="seed-card-desc">0-4 轮对话，纯 DeepSeek V4 + system prompt</div>
            <div class="seed-card-stats">
                <span>~4 条消息</span>
                <span>0 洞察</span>
            </div>
            <button class="btn-seed" data-level="new">生成</button>
        </div>

        <div class="seed-card" data-level="light">
            <div class="seed-card-icon">🌿</div>
            <div class="seed-card-title">轻度用户</div>
            <div class="seed-card-desc">5-15 轮，有身份+情绪趋势</div>
            <div class="seed-card-stats">
                <span>~20 条消息</span>
                <span>~2 洞察</span>
            </div>
            <button class="btn-seed" data-level="light">生成</button>
        </div>

        <div class="seed-card" data-level="medium">
            <div class="seed-card-icon">🌳</div>
            <div class="seed-card-title">中度用户</div>
            <div class="seed-card-desc">15-50 轮，有日记+模式+跨会话</div>
            <div class="seed-card-stats">
                <span>~60 条消息</span>
                <span>~5 洞察</span>
            </div>
            <button class="btn-seed" data-level="medium">生成</button>
        </div>
    </div>

    <div id="progressArea" style="display:none;">
        <div class="seed-progress">
            <div class="seed-progress-bar" id="progressBar"></div>
            <span class="seed-progress-text" id="progressText">生成中...</span>
        </div>
    </div>

    <div id="resultArea" style="display:none;">
        <div class="seed-result-header">
            <span class="seed-result-icon" id="resultIcon">✅</span>
            <span class="seed-result-title" id="resultTitle">数据已生成</span>
        </div>
        <div class="seed-result-stats" id="resultStats"></div>
        <div class="seed-result-actions">
            <a href="/chat/" class="btn-action">💬 去聊天看看</a>
            <a href="/insights/" class="btn-action">📊 去洞察看看</a>
            <a href="/diaries/" class="btn-action">📖 去日记看看</a>
        </div>
    </div>

    
</div>

<style>
.seed-tool-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px;
}
.seed-tool-header h2 {
    margin: 0 0 8px 0;
    font-size: 1.4em;
}
.seed-tool-desc {
    color: #666;
    font-size: 0.9em;
    margin: 0 0 24px 0;
}
.seed-levels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}
.seed-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: all 0.2s;
}
.seed-card:hover {
    border-color: #5B8DB8;
    box-shadow: 0 2px 12px rgba(91,141,184,0.15);
}
.seed-card-icon {
    font-size: 2em;
    margin-bottom: 8px;
}
.seed-card-title {
    font-weight: 600;
    font-size: 1.1em;
    margin-bottom: 4px;
}
.seed-card-desc {
    font-size: 0.85em;
    color: #888;
    margin-bottom: 12px;
    line-height: 1.4;
}
.seed-card-stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    font-size: 0.8em;
    color: #999;
    margin-bottom: 16px;
}
.btn-seed {
    background: #5B8DB8;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 24px;
    cursor: pointer;
    font-size: 0.95em;
    transition: background 0.2s;
}
.btn-seed:hover { background: #4A7A9E; }
.btn-seed:disabled { background: #ccc; cursor: not-allowed; }

.seed-progress {
    background: #f5f5f5;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}
.seed-progress-bar {
    height: 6px;
    background: #5B8DB8;
    border-radius: 3px;
    width: 0%;
    transition: width 0.5s;
    margin-bottom: 8px;
}
.seed-progress-text {
    font-size: 0.9em;
    color: #666;
}

.seed-result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
}
.seed-result-icon { font-size: 1.5em; }
.seed-result-title { font-weight: 600; font-size: 1.1em; }
.seed-result-stats {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.seed-result-stats .stat-item {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
}
.seed-result-stats .stat-value {
    font-size: 1.3em;
    font-weight: 600;
    color: #5B8DB8;
}
.seed-result-stats .stat-label {
    font-size: 0.8em;
    color: #888;
}
.seed-result-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.btn-action {
    background: #f0f4f8;
    color: #333;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9em;
    transition: background 0.2s;
}
.btn-action:hover { background: #e0e8f0; }


</style>

<script>
(function() {
    'use strict';

// ── Seed buttons ──
    document.querySelectorAll('.btn-seed').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var level = this.dataset.level;
            seedData(level);
        });
    });

    function seedData(level) {
        // Disable all seed buttons
        document.querySelectorAll('.btn-seed').forEach(function(b) { b.disabled = true; });

        var progressArea = document.getElementById('progressArea');
        var resultArea = document.getElementById('resultArea');
        progressArea.style.display = 'block';
        resultArea.style.display = 'none';

        var bar = document.getElementById('progressBar');
        var text = document.getElementById('progressText');
        bar.style.width = '30%';
        text.textContent = '正在生成 ' + level + ' 级数据...';



        fetch('/admin/seed?level=' + level, {
            method: 'POST',
            credentials: 'same-origin',
        })
        .then(function(r) {
            if (!r.ok) {
                // 检查响应是不是 HTML（登录页/404页）
                var ct = r.headers.get('Content-Type') || '';
                if (ct.indexOf('text/html') >= 0) {
                    throw new Error('登录状态已过期，请刷新页面后重试');
                }
                return r.json().then(function(e) { throw new Error(e.error || '请求失败'); });
            }
            return r.json();
        })
        .then(function(data) {
            bar.style.width = '100%';
            text.textContent = '完成！';

            resultArea.style.display = 'block';
            document.getElementById('resultIcon').textContent = '✅';
            document.getElementById('resultTitle').textContent =
                level === 'new' ? '🌱 新用户数据已生成' :
                level === 'light' ? '🌿 轻度用户数据已生成' :
                '🌳 中度用户数据已生成';

            var stats = data.stats || {};
            document.getElementById('resultStats').innerHTML =
                '<div class="stat-item"><div class="stat-value">' + (stats.sessions || 0) +
                '</div><div class="stat-label">会话</div></div>' +
                '<div class="stat-item"><div class="stat-value">' + (stats.messages || 0) +
                '</div><div class="stat-label">消息</div></div>' +
                '<div class="stat-item"><div class="stat-value">' + (stats.insights || 0) +
                '</div><div class="stat-label">洞察</div></div>' +
                '<div class="stat-item"><div class="stat-value">' + (stats.diaries || 0) +
                '</div><div class="stat-label">日记</div></div>';


        })
        .catch(function(err) {
            bar.style.width = '100%';
            bar.style.background = '#c62828';
            text.textContent = '失败: ' + err.message;

            resultArea.style.display = 'block';
            document.getElementById('resultIcon').textContent = '❌';
            document.getElementById('resultTitle').textContent = '生成失败';
            document.getElementById('resultStats').innerHTML = '';


        })
        .finally(function() {
            document.querySelectorAll('.btn-seed').forEach(function(b) { b.disabled = false; });
        });
    }

})();
</script>
{% endblock %}
