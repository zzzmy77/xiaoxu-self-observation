{% extends "base.html" %}
{% block content %}
<div class="insights-container">
    <div class="insights-header">
        <h2>🔍 小绪的观察笔记</h2>
        <p>看看你最近的自己和之前有什么不同</p>
    </div>

    <!-- V2 内容由 JS 渲染到这里，替换 dashboard + chart -->
    <div id="insightsMain"></div>

    <!-- 洞察日历 -->
    <div class="insight-calendar-section">
        <div class="calendar-card">
            <div class="calendar-nav">
                <button id="insightCalPrev" class="cal-btn">‹</button>
                <span id="insightCalTitle" class="cal-title"></span>
                <button id="insightCalNext" class="cal-btn">›</button>
            </div>
            <div class="calendar-grid" id="insightCalGrid">
                <div class="cal-day-header">日</div>
                <div class="cal-day-header">一</div>
                <div class="cal-day-header">二</div>
                <div class="cal-day-header">三</div>
                <div class="cal-day-header">四</div>
                <div class="cal-day-header">五</div>
                <div class="cal-day-header">六</div>
            </div>
        </div>

        <!-- 选定日期的洞察详情 -->
        <div class="day-detail" id="insightDayDetail" style="display:none;">
            <h3 id="insightDayTitle"></h3>
            <div id="insightDayBody"></div>
        </div>
    </div>
</div>

<style>
/* V2 样式 */
.v2-loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
.v2-loading.error { color: #c62828; }
.v2-headline {
    background: linear-gradient(135deg, #F9D8C6 0%, #A9C0D6 100%);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
}
.v2-headline-icon { font-size: 24px; }
.v2-headline-text { font-size: 15px; color: #333; line-height: 1.5; }

.v2-card {
    background: #fff; border: 1px solid #eee; border-radius: 12px;
    padding: 16px 20px; margin-bottom: 16px;
}
.v2-card h4 { margin: 0 0 12px 0; font-size: 14px; color: #555; }

.emotion-cloud-wrap { text-align: center; }
#emotionCloudCanvas { max-width: 100%; border-radius: 8px; }

.v2-warm-msg {
    background: #FFF8E1; border-radius: 8px; padding: 10px 14px;
    margin-top: 10px; font-size: 13px; color: #795548; line-height: 1.5;
}

/* 时间线 */
.v2-timeline { position: relative; padding-left: 20px; }
.v2-timeline::before {
    content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px;
    width: 2px; background: #e0e0e0;
}
.v2-timeline-item {
    position: relative; margin-bottom: 14px; padding-left: 16px;
}
.v2-timeline-item::before {
    content: ''; position: absolute; left: -14px; top: 6px;
    width: 8px; height: 8px; border-radius: 50%; background: #5B8DB8;
}
.v2-tl-date { font-size: 11px; color: #999; margin-bottom: 2px; }
.v2-tl-title { font-size: 14px; color: #333; margin-bottom: 4px; line-height: 1.4; }
.v2-tl-content .tag { font-size: 11px; }

/* 认知模式 */
.v2-pattern-list { display: flex; flex-direction: column; gap: 12px; }
.v2-pattern-card {
    background: #f8f9fa; border-radius: 10px; padding: 12px 16px;
    border-left: 3px solid #5B8DB8;
}
.v2-pattern-name { font-weight: 600; font-size: 14px; color: #333; margin-bottom: 2px; }
.v2-pattern-meta { font-size: 11px; color: #999; margin-bottom: 8px; }
.v2-pattern-detail { margin-bottom: 8px; }
.v2-pd-row { font-size: 13px; margin-bottom: 4px; color: #555; }
.v2-pd-label {
    display: inline-block; background: #e8f0fe; border-radius: 4px;
    padding: 1px 6px; font-size: 11px; margin-right: 4px; color: #5B8DB8;
}
.v2-pattern-evolution { font-size: 12px; color: #888; margin-bottom: 6px; }
.v2-evo-dot { display: inline-block; padding: 0 4px; }
.v2-evo-dot + .v2-evo-dot::before { content: ' → '; color: #ccc; }
.v2-pattern-triggers { font-size: 11px; color: #888; }
.v2-pattern-triggers .tag { font-size: 10px; }

/* 转变支点 */
.v2-card-pivot { border-left: 3px solid #2ECC71; }
.v2-pivot-text {
    font-size: 14px; line-height: 1.7; color: #333;
    padding: 4px 0;
}

/* 洞察日历卡片 */
.insight-cal-section { margin-top: 20px; }
.insight-cal-card {
    background: #f8f9fa; border-radius: 10px; padding: 14px 16px;
    margin-bottom: 12px; border-left: 3px solid #5B8DB8;
}
.insight-cal-time { font-size: 11px; color: #999; margin-bottom: 4px; }
.insight-cal-body p { font-size: 14px; color: #333; line-height: 1.6; margin: 0; }
.insight-cal-tags { margin-top: 8px; }
.insight-cal-tags .tag { font-size: 11px; }
</style>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/insight_charts.js') }}"></script>
{% endblock %}
