<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 小绪 · 自我观察日记</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #F9D8C6 0%, #A9C0D6 100%);
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            background: white;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-logo h1 { font-size: 28px; margin-bottom: 4px; }
        .auth-logo p { font-size: 13px; color: #777; }
        .flash-messages { margin-bottom: 16px; }
        .flash-error {
            background: #F8D7DA; color: #721C24;
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; margin-bottom: 4px;
        }
        .flash-success {
            background: #D4EDDA; color: #155724;
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; margin-bottom: 4px;
        }
        .auth-field {
            margin-bottom: 16px;
        }
        .auth-field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .auth-field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D0C8C0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .auth-field input:focus {
            border-color: #A9C0D6;
            box-shadow: 0 0 0 2px rgba(169,192,214,0.3);
        }
        .auth-btn {
            width: 100%;
            padding: 10px;
            background: #2C2C3C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
        }
        .auth-btn:hover { background: #3D3D52; }
        .auth-links {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }
        .auth-links a { color: #5B8DB8; text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
        .demo-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #777;
            border: 1px solid #D0C8C0;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .demo-btn:hover { background: #F8F5F0; }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0;
            font-size: 12px;
            color: #999;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E8E0D8;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <h1>☀️ 小绪</h1>
            <p>一面有记忆的镜子</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="post">
            <div class="auth-field">
                <label>用户名</label>
                <input type="text" name="username" required autofocus placeholder="输入用户名">
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input type="password" name="password" required placeholder="输入密码">
            </div>
            <button type="submit" class="auth-btn">登录</button>
        </form>

        <div class="auth-divider" style="display:none;">或</div>

        <a href="{{ url_for('auth.demo_login') }}" class="demo-btn" style="display:none;">
            🚪 Demo 账号直接体验
        </a>

        <div class="auth-links">
            还没有账号？<a href="{{ url_for('auth.register') }}">注册</a>
        </div>
    </div>
</body>
</html>
